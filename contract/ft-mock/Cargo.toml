[package]
name = "ft-mock"
version = "0.1.0"
edition = "2021"
# 測試用 NEP-141（模擬穩定幣 tUSDC）。只在 sandbox 測試與 demo 使用。

[lib]
crate-type = ["cdylib"]

[dependencies]
near-sdk = "5.30.0"
near-contract-standards = "5.30.0"

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true

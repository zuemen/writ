[package]
name = "ft-mock"
version = "0.1.0"
edition = "2021"
# Test NEP-141 (mock stablecoin tUSDC). Used only in sandbox tests and the demo.

[lib]
crate-type = ["cdylib"]

[dependencies]
near-sdk = "5.30.0"
near-contract-standards = "5.30.0"

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true

# cargo mutants: mutate only the contract itself; tests rebuild the wasm from the mutated source with WRIT_REBUILD=1 and then run all tests: fast unit tests and fuzz first, then the attack bench
examine_globs = ["src/lib.rs"]
exclude_re = ["attestation_preview", "Contract::owner"]
test_tool = "cargo"
additional_cargo_test_args = ["--", "--test-threads=2"]

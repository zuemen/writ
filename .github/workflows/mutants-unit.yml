# 手動觸發：只拿快速單元測試與 fuzz（cargo test --lib）去打基線裡攻擊台沒抓到的突變。
# 基線 contract/mutants-baseline 來自完整一輪 mutants.yml；lib.rs 改動後基線就過期，要重跑完整一輪。
name: mutants-unit
on: workflow_dispatch
jobs:
  mutants:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97.0"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "contract -> target"
      - run: cargo install cargo-mutants --locked
      - name: mutants
        continue-on-error: true
        env:
          SEEDS: "4"
        run: |
          cd contract
          mkdir -p mutants.out
          cp mutants-baseline/caught.txt mutants-baseline/unviable.txt mutants-baseline/timeout.txt mutants.out/
          cargo mutants --no-config --no-shuffle --iterate --file src/lib.rs \
            --exclude-re attestation_preview --exclude-re Contract::owner \
            --shard ${{ matrix.shard }}/8 -- --lib
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-${{ matrix.shard }}
          path: |
            contract/mutants.out/outcomes.json
            contract/mutants.out/caught.txt
            contract/mutants.out/missed.txt
            contract/mutants.out/timeout.txt
            contract/mutants.out/unviable.txt

# 每次 push 依 README 順序跑：setup → 攻擊台 → 8 步 demo → 驗證端。只用本機 sandbox，不需要任何 secret。
name: reproduce
on: [push, pull_request, workflow_dispatch]
jobs:
  reproduce:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97.0"
          targets: wasm32-unknown-unknown
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y libsodium23
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "contract -> target\ncontract/ft-mock -> target"
      - run: make setup
      - run: make test
      - name: invariant fuzz, random call sequences and failed callbacks
        run: cd contract && SEEDS=20 THREADS=4 cargo test --lib fuzz
      - run: make demo
      - run: make keri-check
      - run: make credit-demo
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bench
          path: docs/bench.md
  # 同一個流程在 Dockerfile 裡再跑一次，證明沒有 Rust／Python 的環境也重現得出來
  docker:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t writ .
      - run: docker run --rm writ
